<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Radar</title>
<style>
/* Layout B1: a sidebar of groups, one table per group. Look: T3 Code's default theme. */
:root {
  --bg: #000; --card: #111; --border: rgba(255,255,255,.08); --divider: rgba(255,255,255,.06);
  --hover: #191a1d; --pressed: #232428; --text: #f1f3f7; --muted: #a3a3a3; --dim: #6e6e73; --faint: #5c5c62;
  --red: #f2555a; --amber: #e3b341; --t3: #d97757; --dash: #3a3a3f;
  --f-ui: -apple-system, BlinkMacSystemFont, "Inter Variable", "Segoe UI", system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  /* Tailwind 400 shades for project badges in dark mode */
  --gray: #9ca3af; --red-b: #f87171; --orange: #fb923c; --amber-b: #fbbf24; --yellow: #facc15; --lime: #a3e635;
  --green: #4ade80; --emerald: #34d399; --teal: #2dd4bf; --cyan: #22d3ee; --sky: #38bdf8; --blue: #60a5fa;
  --indigo: #818cf8; --violet: #a78bfa; --purple: #c084fc; --fuchsia: #e879f9; --pink: #f472b6; --rose: #fb7185;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #fff; --card: #f7f7f8; --border: rgba(0,0,0,.08); --divider: rgba(0,0,0,.06);
    --hover: #eeeef0; --pressed: #e4e4e7; --text: #18181b; --muted: #5f5f66; --dim: #8e8e93; --faint: #a1a1a6;
    --red: #d93036; --amber: #a86b00; --t3: #c96442; --dash: #c7c7cc;
    /* Tailwind 600 shades in light mode */
    --gray: #4b5563; --red-b: #dc2626; --orange: #ea580c; --amber-b: #d97706; --yellow: #ca8a04; --lime: #65a30d;
    --green: #16a34a; --emerald: #059669; --teal: #0d9488; --cyan: #0891b2; --sky: #0284c7; --blue: #2563eb;
    --indigo: #4f46e5; --violet: #7c3aed; --purple: #9333ea; --fuchsia: #c026d3; --pink: #db2777; --rose: #e11d48;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: 14px; line-height: 1.5;
  padding: 20px 24px 48px; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
a { color: var(--text); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--t3); outline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
button[disabled] { opacity: .5; cursor: default; }
.mono { font-family: var(--f-mono); }

header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
#status { font-size: 13px; color: var(--muted); }
#status .bad, #err { color: var(--red); }
#err { font-size: 13px; }
.btn { font-size: 13px; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 5px 12px; }
.btn:hover:not([disabled]) { background: var(--hover); }
.hbtns { display: flex; gap: 8px; }

.cols { display: flex; flex-wrap: wrap; gap: 24px; align-items: start; }
nav { flex: 1 1 200px; max-width: 232px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 16px; }
.seg { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 3px; margin-bottom: 14px; }
.seg button { flex: 1; font-size: 13px; border: 0; border-radius: 6px; padding: 5px 8px; background: transparent; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--pressed); color: var(--text); }
.nav-h { font-size: 12px; color: var(--faint); padding: 14px 10px 4px; border: 0; background: none; text-align: left; }
.nav-h:first-of-type { padding-top: 0; }
.nav-i { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px;
  border: 0; background: transparent; color: var(--muted); text-align: left; font-size: 14px; }
.nav-i.move { color: var(--text); }
.nav-i:hover { background: var(--hover); }
.nav-i[aria-current="true"] { background: var(--hover); color: var(--text); }
.nav-i .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.nav-i .n.red { color: var(--red); }
.nav-i .lbl { display: inline-flex; gap: 6px; align-items: center; }
.nav-sep { height: 1px; background: var(--divider); margin: 10px 0; }

main { flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
section { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 16px; }
section.parked { opacity: .85; }
h2 { margin: 0; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
h2.red { color: var(--red); }
h2 .hint { font-weight: 400; font-size: 13px; color: var(--muted); }
.table { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.empty { padding: 14px; color: var(--muted); font-size: 13px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 56px auto; gap: 14px; align-items: center; padding: 10px 14px;
  border-top: 1px solid var(--divider); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--hover); }
.l1, .l2 { display: flex; gap: 8px; align-items: center; min-width: 0; }
.l2 { gap: 6px; font-size: 13px; margin-top: 2px; }
.badge { flex: none; width: 18px; height: 18px; border-radius: 25%; display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--f-mono); font-size: 9px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.badge i { width: 12px; height: 12px; background: var(--c); -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
.title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.num { font-family: var(--f-mono); font-size: 12px; color: var(--faint); white-space: nowrap; }
.draft { flex: none; font-size: 11px; color: var(--muted); border: 1px dashed var(--dash); border-radius: 4px; padding: 0 5px; }
.av { flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--border); object-fit: cover; }
.who { flex: none; color: var(--muted); }
.dot { color: var(--faint); }
.why { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.why.red { color: var(--red); }
.age { display: flex; gap: 4px; align-items: center; justify-content: flex-end; font-family: var(--f-mono); font-size: 12px; color: var(--dim); }
.age.old { color: var(--amber); }
.acts { display: flex; gap: 4px; align-items: center; }
.t3btn { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; border: 1px solid var(--border); border-radius: 7px;
  padding: 4px 9px; white-space: nowrap; }
.t3btn:hover { text-decoration: none; background: var(--pressed); }
.t3btn svg { stroke: var(--faint); }
.t3btn.linked svg { stroke: var(--t3); }
.ibtn { display: inline-flex; border: 0; background: transparent; color: var(--muted); padding: 5px; border-radius: 6px; }
.ibtn:hover { background: var(--pressed); color: var(--text); }
.pnote { font-size: 12px; color: var(--muted); white-space: nowrap; margin-right: 6px; }
.sbtn { font-size: 12px; border: 1px solid var(--border); background: transparent; border-radius: 7px; padding: 4px 9px; white-space: nowrap; }
.sbtn:hover { background: var(--pressed); }
#snooze-menu { position: absolute; z-index: 10; display: flex; flex-direction: column; min-width: 140px; padding: 4px;
  background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
#snooze-menu[hidden] { display: none; }
#snooze-menu button { border: 0; background: transparent; text-align: left; font-size: 13px; padding: 5px 10px; border-radius: 6px; }
#snooze-menu button:hover { background: var(--hover); }
/* A quick tooltip for [data-tip] elements (the repo badges), instead of the slow native title */
.badge[data-tip] { cursor: default; }
#tip { position: fixed; z-index: 20; pointer-events: none; padding: 5px 8px; border-radius: 6px; font-size: 12px; line-height: 1.4;
  background: var(--pressed); color: var(--text); border: 1px solid var(--border); box-shadow: 0 6px 18px rgba(0,0,0,.35);
  white-space: nowrap; opacity: 0; transform: translateY(2px); transition: opacity .08s, transform .08s; }
#tip.on { opacity: 1; transform: none; }
#tip .repo { font-family: var(--f-mono); font-weight: 600; }
#tip .sub { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { #tip { transition: none; transform: none; } }
footer { font-size: 12px; color: var(--faint); display: flex; flex-direction: column; gap: 2px; }

@media (max-width: 720px) {
  body { padding: 16px 16px 40px; }
  nav { max-width: none; position: static; }
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .acts { grid-column: 1 / -1; justify-content: flex-start; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div id="status">Loading…</div>
    <div class="hbtns">
      <span id="err" role="alert"></span>
      <button id="refresh" class="btn" type="button" title="Fetch what changed on GitHub now">Refresh</button>
      <button id="sweep" class="btn" type="button" title="Ask Claude to re-read what moved and redo the notes">Sweep now</button>
    </div>
  </header>

  <div class="cols">
    <nav aria-label="Groups" id="nav">
      <div class="seg" role="group" aria-label="Order within groups">
        <button type="button" data-order="quick">Quick first</button>
        <button type="button" data-order="deep">Deep first</button>
      </div>
    </nav>
    <main id="main" aria-live="polite"></main>
  </div>

  <footer>
    <span>Open in T3 opens the PR's thread, or starts a draft thread when there isn't one. The asterisk is lit when a thread exists.</span>
    <span>Settle hides a PR until it changes again: a push, a review or a comment. Settled and snoozed PRs stay one click away, in the sidebar.</span>
  </footer>
</div>
<div id="tip" role="tooltip"></div>
<div id="snooze-menu" role="menu" hidden>
  <button type="button" role="menuitem" data-days="1">Until tomorrow</button>
  <button type="button" role="menuitem" data-days="3">For 3 days</button>
  <button type="button" role="menuitem" data-days="7">For a week</button>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const ICON = {
    clock: '<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>',
    check: '<path d="m5 12 5 5 9-10"></path>',
    star: '<path d="M12 3v18"></path><path d="M3 12h18"></path><path d="m5.6 5.6 12.8 12.8"></path><path d="m18.4 5.6-12.8 12.8"></path>',
  };
  function svg(name, size, width) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", width || 2);
    s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true");
    s.innerHTML = ICON[name];
    return s;
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ---- the groups, in sidebar order. "move" groups are the default view; the others filter.
  const GROUPS = [
    { id: "fix", label: "Fix", hint: "your PRs that need you", nav: "move", red: true },
    { id: "review", label: "Review", hint: "review requested", nav: "move" },
    { id: "chase", label: "Chase", hint: "a message from you moves these", nav: "move" },
    { id: "decide", label: "Decide: finish or close", hint: "stale drafts and abandoned PRs", nav: "later" },
    { id: "drafts", label: "Drafts in progress", hint: "yours, still being written", nav: "later" },
    { id: "waiting", label: "Your PRs, with reviewers", hint: "waiting on review", nav: "away" },
    { id: "authors", label: "Reviews, with authors", hint: "conflict or changes requested", nav: "away" },
    { id: "team", label: "Team PRs, no reviewer", hint: "nobody has moved these in a while", nav: "away" },
  ];
  const PARKED = { id: "parked", label: "Settled and snoozed", hint: "back when the PR changes or the snooze ends" };
  const NAV_HEADS = { move: "Your move", later: "Later", away: "Not on you" };
  const FIX_ACTIONS = new Set(["Answer review comments", "Resolve the merge conflict", "Fix failing CI", "Approved: merge it"]);
  const BROKEN = new Set(["Answer review comments", "Resolve the merge conflict", "Fix failing CI"]);

  function groupOf(i) {
    if (i.section === "mine") {
      if (i.action === "Abandoned? Close or revive" || i.action === "Stale draft: finish or close") return "decide";
      if (i.draft) return "drafts";
      if (FIX_ACTIONS.has(i.action)) return "fix";
      if (i.action === "Ask someone to review" || i.action === "Nudge your reviewer") return "chase";
      return "waiting";
    }
    if (i.section === "review") {
      if (i.mergeable === "CONFLICTING") return "authors";
      if (i.decision === "CHANGES_REQUESTED" && !i.pushedSinceMyReview) return "authors";
      return "review";
    }
    return i.stall === "Approved and green, not merged" ? "chase" : "team";
  }

  // ---- state
  let board = null;
  const store = {
    get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private window */ } },
  };
  let order = store.get("pr-radar-order", "quick");
  let view = store.get("pr-radar-view", "move"); // "move" or one group id
  if (view !== "move" && view !== "parked" && !GROUPS.some((g) => g.id === view)) view = "move";

  // ---- text helpers
  function sentence(s) { s = String(s || "").trim(); return s ? s[0].toUpperCase() + s.slice(1) : ""; }
  function join(parts) {
    return parts.filter(Boolean).map((p) => { p = sentence(p); return /[.!?…]$/.test(p) ? p : p + "."; }).join(" ").replace(/\.$/, "");
  }
  function names(list) { return list.map((r) => r.replace(/^@/, "")).join(", "); }
  function minsAgo(ts) {
    if (!ts) return null;
    const m = (Date.now() - new Date(ts).getTime()) / 6e4;
    if (m < 1) return "just now";
    if (m < 60) return Math.round(m) + " min ago";
    if (m < 2880) return Math.round(m / 60) + " h ago";
    return Math.round(m / 1440) + " days ago";
  }
  function untilText(ts) {
    const d = new Date(ts), days = (d - Date.now()) / 864e5;
    return days < 6 ? d.toLocaleDateString(undefined, { weekday: "short" }) : d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function ageOf(i) { return i.section === "mine" ? i.idleDays : i.section === "review" ? i.waitingDays : i.days; }
  function reviewReason(i) {
    if (i.pushedSinceMyReview) return "New commits since your review";
    if (i.requestedMe) return "Requested from you";
    if ((i.requestedTeams || []).length) return "Requested from " + i.requestedTeams.join(", ");
    if ((i.areas || []).length) return "In your areas: " + i.areas.slice(0, 2).join(", ");
    return sentence((i.reasons || [])[0] || "Suggested for you");
  }
  // The one-line why or waiting-on summary on line 2.
  function whyOf(i, g) {
    const n = i.note || {};
    const sweep = n.question ? "Waiting on you: " + n.question : (n.next || n.left || n.why);
    const flags = (i.flags || []).join(", ");
    switch (g) {
      case "fix": return join([i.action === "Approved: merge it" ? "Approved, merge it" : flags || i.action, sweep]);
      case "chase":
        if (i.section === "team") return join(["Approved, not merged", "Ask " + i.author + " to merge"]);
        return join([i.action === "Nudge your reviewer" && (i.requested || []).length
          ? "Waiting on " + names(i.requested) + " for a review" : "No reviewer requested", sweep]);
      case "decide": return join([flags || "No activity for " + Math.round(i.idleDays || 0) + " days", sweep]);
      case "drafts": return join([flags, sweep]) || "Draft in progress";
      case "waiting": return join([(i.requested || []).length ? "Waiting on " + names(i.requested) : "Waiting on review", sweep]);
      case "review": return join([reviewReason(i), n.why || n.next]);
      case "authors": return join([i.mergeable === "CONFLICTING" ? "Merge conflict on the author's side" : "Changes requested, waiting on the author",
        reviewReason(i)]);
      default: return join([i.stall, (i.areas || []).length ? "Touches " + i.areas.slice(0, 2).join(", ") : ""]);
    }
  }

  // ---- T3
  // t3code://new?pr=... opens a draft thread about the PR in T3 Code (nothing runs until Send).
  function newThreadUrl(i) {
    const n = i.note || {};
    let prompt;
    if (i.section === "mine") {
      prompt = "Take over " + i.url + "." + (n.next ? " Next step from the PR radar: " + n.next : "") +
        (n.question ? " Open question: " + n.question : "");
    } else if (i.section === "review") {
      prompt = "I'm peer reviewing " + i.url + " by " + i.author + "." +
        (i.pushedSinceMyReview ? " There are new commits since my last review." : "");
    } else {
      prompt = "Look at " + i.url + " by " + i.author + ". The PR radar says: " + i.stall +
        " for " + Math.round(i.days || 0) + " days. Work out what it needs to get over the line, and who should do it.";
    }
    return "t3code://new?" + new URLSearchParams({ pr: i.url, prompt }).toString();
  }
  const t3Href = (u) => (typeof u === "string" && u.startsWith("t3code://") ? u : null);
  function t3Button(i) {
    const open = (i.threads || []).find((t) => t3Href(t.openUrl));
    const a = el("a", "t3btn" + (open ? " linked" : ""));
    a.append(svg("star", 12, 2.4), "Open in T3");
    a.href = open ? open.openUrl : newThreadUrl(i);
    a.title = open ? "Open “" + (open.title || "the linked thread") + "”"
      : "Start a draft thread about this PR. Nothing runs until you press Send.";
    return a;
  }
  // T3's built-in browser asks before following an app link, so the server opens T3 links instead.
  document.addEventListener("click", async (ev) => {
    if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    const a = ev.target instanceof Element ? ev.target.closest("a[href^='t3code://']") : null;
    if (!a) return;
    ev.preventDefault();
    try { await api("/api/open", { url: a.href }); } catch (e) { location.href = a.href; }
  });

  // The repo's T3 project badge: the project's icon if it has one, else T3's monogram.
  const COLORS = new Set(["gray", "red", "orange", "amber", "yellow", "lime", "green", "emerald", "teal", "cyan", "sky", "blue",
    "indigo", "violet", "purple", "fuchsia", "pink", "rose"]);
  const colorVar = (c) => (c === "red" ? "--red-b" : c === "amber" ? "--amber-b" : "--" + (COLORS.has(c) ? c : "blue"));
  function badge(repo) {
    const p = (board.projects || {})[repo] || {};
    const b = el("span", "badge");
    b.dataset.tip = repo;
    b.dataset.tipSub = p.project ? (p.project !== repo.split("/")[1] ? "T3 project: " + p.project : "") : "No T3 project";
    b.setAttribute("aria-label", repo);
    const icon = p.icon;
    if (icon && icon.kind === "lucide" && /^[a-z0-9-]+$/.test(icon.name || "")) {
      b.style.setProperty("--c", "var(" + colorVar(icon.color || p.color) + ")");
      const i = el("i");
      i.style.setProperty("--icon", "url(https://cdn.jsdelivr.net/npm/lucide-static@0.460.0/icons/" + icon.name + ".svg)");
      b.append(i);
    } else {
      b.style.setProperty("--c", "var(" + colorVar(p.color) + ")");
      b.textContent = p.monogram || "PR";
    }
    return b;
  }
  // One floating tooltip for every [data-tip], shown at once on hover, above the element
  // (below when there's no room). Fixed position, so the tables' overflow can't clip it.
  const tip = $("tip");
  let tipFor = null;
  function showTip(t) {
    tipFor = t;
    tip.replaceChildren(el("div", "repo", t.dataset.tip));
    if (t.dataset.tipSub) tip.append(el("div", "sub", t.dataset.tipSub));
    const r = t.getBoundingClientRect();
    const w = tip.offsetWidth, h = tip.offsetHeight;
    const top = r.top - h - 6 >= 4 ? r.top - h - 6 : r.bottom + 6;
    tip.style.top = top + "px";
    tip.style.left = Math.min(Math.max(4, r.left + r.width / 2 - w / 2), innerWidth - w - 4) + "px";
    tip.classList.add("on");
  }
  function hideTip() { tipFor = null; tip.classList.remove("on"); }
  document.addEventListener("mouseover", (ev) => {
    const t = ev.target instanceof Element ? ev.target.closest("[data-tip]") : null;
    if (t && t !== tipFor) showTip(t); else if (!t && tipFor) hideTip();
  });
  addEventListener("scroll", hideTip, { passive: true });
  document.documentElement.addEventListener("mouseleave", hideTip);
  function avatar(login) {
    const img = el("img", "av");
    img.src = "/avatar/" + encodeURIComponent(login);
    img.alt = ""; img.loading = "lazy"; img.width = img.height = 16; img.title = login;
    img.onerror = () => { img.style.visibility = "hidden"; };
    return img;
  }

  // ---- API
  async function api(path, body) {
    const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    return r.json();
  }
  async function load() {
    try { board = await api("/api/board"); $("err").textContent = board.error ? "Last refresh failed: " + board.error : ""; render(); }
    catch (e) { $("err").textContent = "Can't reach the radar server. Is it running?"; }
  }
  async function triage(i, action, days) {
    try { board = await api("/api/triage", { key: i.key, action, days }); render(); }
    catch (e) { $("err").textContent = "Couldn't save that: " + e.message; }
  }

  // ---- snooze menu
  const menu = $("snooze-menu");
  let menuItem = null;
  function openMenu(btn, i) {
    menuItem = i;
    const r = btn.getBoundingClientRect();
    menu.hidden = false;
    menu.style.top = (r.bottom + window.scrollY + 4) + "px";
    menu.style.left = Math.max(8, r.right + window.scrollX - menu.offsetWidth) + "px";
    menu.querySelector("button").focus();
  }
  function closeMenu() { menu.hidden = true; menuItem = null; }
  menu.addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-days]");
    if (b && menuItem) triage(menuItem, "snooze", Number(b.dataset.days));
    closeMenu();
  });
  document.addEventListener("click", (ev) => { if (!menu.hidden && !menu.contains(ev.target) && !ev.target.closest(".snooze")) closeMenu(); });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeMenu(); });

  // ---- rows
  function row(i, g) {
    const r = el("div", "row");
    const left = el("div");
    const l1 = el("div", "l1");
    const t = el("a", "title", i.title);
    t.href = i.url; t.target = "_blank"; t.rel = "noopener"; t.title = i.title;
    l1.append(badge(i.repo), t, el("span", "num", "#" + i.number));
    if (i.draft) l1.append(el("span", "draft", "Draft"));
    const l2 = el("div", "l2");
    const mine = i.author === board.login;
    const why = whyOf(i, g);
    const w = el("span", "why" + (g === "fix" && BROKEN.has(i.action) ? " red" : ""), why);
    w.title = why;
    l2.append(avatar(i.author), el("span", "who", mine ? "you" : i.author), el("span", "dot", "·"), w);
    left.append(l1, l2);

    const d = ageOf(i);
    const old = d != null && d > 7;
    const age = el("div", "age" + (old ? " old" : ""));
    age.title = d == null ? "" : (i.section === "mine" ? "Idle for " : i.section === "review" ? "Waiting for " : "Quiet for ") + Math.round(d) + " days";
    if (old) age.append(svg("clock", 12, 2.2));
    age.append(el("span", null, d == null ? "" : Math.round(d) + "d"));

    const acts = el("div", "acts");
    if (g === "parked") {
      const tr = i.triage || {};
      acts.append(el("span", "pnote", tr.action === "snooze" ? "Snoozed until " + untilText(tr.until)
        : "Settled " + (minsAgo(tr.at) || "") + ", back when it changes"));
      const b = el("button", "sbtn", "Bring back");
      b.type = "button";
      b.onclick = () => triage(i, "clear");
      acts.append(t3Button(i), b);
    } else {
      const s = el("button", "ibtn snooze");
      s.type = "button"; s.title = "Snooze"; s.setAttribute("aria-label", "Snooze"); s.setAttribute("aria-haspopup", "menu");
      s.append(svg("clock", 15));
      s.onclick = (ev) => { ev.stopPropagation(); menu.hidden || menuItem !== i ? openMenu(s, i) : closeMenu(); };
      const c = el("button", "ibtn");
      c.type = "button"; c.title = "Settle: hide until the PR changes"; c.setAttribute("aria-label", "Settle");
      c.append(svg("check", 15));
      c.onclick = () => triage(i, "done");
      acts.append(t3Button(i), s, c);
    }
    r.append(left, age, acts);
    return r;
  }

  function section(g, items, emptyText) {
    const s = el("section", g.id === "parked" ? "parked" : null);
    s.id = "g-" + g.id;
    const h = el("h2", g.red ? "red" : null, g.label);
    h.append(el("span", "hint", g.hint));
    const t = el("div", "table");
    if (!items.length) t.append(el("div", "empty", emptyText || "Nothing here right now."));
    items.forEach((i) => t.append(row(i, g.id)));
    s.append(h, t);
    return s;
  }

  // Within a group: quick or deep first, otherwise the radar's own score order (never age).
  function sorted(items) {
    const rank = (i) => ((i.effort === "deep") === (order === "quick") ? 1 : 0);
    return items.map((i, n) => [i, n]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map((x) => x[0]);
  }

  function setView(v, jump) {
    view = v;
    store.set("pr-radar-view", v);
    render();
    if (jump) { const s = $("g-" + jump); if (s) s.scrollIntoView({ block: "start" }); }
    else window.scrollTo(0, 0);
  }

  function renderNav(buckets, parked) {
    const nav = $("nav");
    nav.querySelectorAll(".nav-h, .nav-i, .nav-sep").forEach((n) => n.remove());
    nav.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.order === order)));
    let head = null;
    GROUPS.forEach((g) => {
      if (g.nav !== head) {
        head = g.nav;
        const h = el("button", "nav-h", NAV_HEADS[head]);
        h.type = "button";
        if (head === "move") { h.title = "Show Fix, Review and Chase"; h.onclick = () => setView("move"); }
        else { h.disabled = true; h.style.cursor = "default"; h.style.opacity = "1"; }
        nav.append(h);
      }
      const n = buckets[g.id].length;
      const b = el("button", "nav-i" + (g.nav === "move" ? " move" : ""));
      b.type = "button";
      b.append(el("span", null, g.label), el("span", "n" + (g.red && n ? " red" : ""), String(n)));
      b.setAttribute("aria-current", String(view === g.id));
      b.onclick = () => {
        if (view === g.id) setView("move");
        else if (g.nav === "move") setView("move", g.id);
        else setView(g.id);
      };
      nav.append(b);
    });
    nav.append(el("div", "nav-sep"));
    const p = el("button", "nav-i");
    p.type = "button";
    const lbl = el("span", "lbl");
    lbl.append(svg("check", 13), PARKED.label);
    p.append(lbl, el("span", "n", String(parked.length)));
    p.setAttribute("aria-current", String(view === "parked"));
    p.onclick = () => setView(view === "parked" ? "move" : "parked");
    nav.append(p);
  }

  function renderStatus() {
    const sw = (board.sweeps || [])[0];
    const st = $("status");
    st.replaceChildren(board.refreshing ? "Refreshing…" : "Refreshed " + (minsAgo(board.refreshedAt) || "never"), " · ");
    if (!sw) st.append(board.sweepsEnabled ? "no sweeps yet" : "sweeps off");
    else if (sw.status === "running") st.append("sweeping now");
    else if (sw.status === "error") {
      const e = el("span", "bad", "last sweep failed " + minsAgo(sw.started_at));
      e.title = sw.summary || "";
      st.append(e);
    } else st.append("last sweep " + minsAgo(sw.finished_at || sw.started_at));
    const running = !!sw && sw.status === "running";
    $("sweep").disabled = running || !board.sweepsEnabled;
    $("sweep").textContent = running ? "Sweeping…" : "Sweep now";
    $("refresh").disabled = !!board.refreshing;
  }

  function render() {
    if (!board) return;
    hideTip(); // the rows it pointed at are about to be replaced
    renderStatus();
    const buckets = Object.fromEntries(GROUPS.map((g) => [g.id, []]));
    const parked = [];
    // mine, then review, then team: each already in the radar's score order
    [].concat(board.mine, board.review, board.team).forEach((i) => (i.hidden ? parked : buckets[groupOf(i)]).push(i));
    for (const k in buckets) buckets[k] = sorted(buckets[k]);
    renderNav(buckets, parked);
    const main = $("main");
    main.replaceChildren();
    if (view === "parked") main.append(section(PARKED, parked, "Nothing settled or snoozed."));
    else if (view !== "move") main.append(section(GROUPS.find((g) => g.id === view), buckets[view]));
    else {
      const move = GROUPS.filter((g) => g.nav === "move");
      if (move.every((g) => !buckets[g.id].length)) main.append(el("div", "empty", "Nothing needs a move from you. The sidebar has what's waiting on others."));
      move.forEach((g) => { if (buckets[g.id].length) main.append(section(g, buckets[g.id])); });
    }
  }

  document.querySelectorAll(".seg button").forEach((b) => {
    b.onclick = () => { order = b.dataset.order; store.set("pr-radar-order", order); render(); };
  });
  $("sweep").onclick = async () => {
    $("sweep").disabled = true;
    $("sweep").textContent = "Sweeping…";
    try { await api("/api/sweep", {}); } catch (e) { $("err").textContent = e.message; }
    setTimeout(load, 1500);
  };
  $("refresh").onclick = async () => {
    $("refresh").disabled = true;
    $("status").textContent = "Refreshing…";
    try { board = await api("/api/refresh", {}); render(); } catch (e) { $("err").textContent = e.message; }
  };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
